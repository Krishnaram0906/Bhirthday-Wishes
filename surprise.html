<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Surprise! ✨</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        min-height: 100vh;
        background: radial-gradient(ellipse at center, #1a0533 0%, #000000 100%);
        overflow: hidden;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* Sparkle particles */
    .sparkle {
        position: fixed;
        width: 4px;
        height: 4px;
        background: white;
        border-radius: 50%;
        pointer-events: none;
        animation: sparkleAnim linear infinite;
        box-shadow: 0 0 6px 2px rgba(255,255,255,0.8);
    }

    @keyframes sparkleAnim {
        0% {
            transform: translateY(0) scale(0);
            opacity: 0;
        }
        50% {
            transform: translateY(-50vh) scale(1);
            opacity: 1;
        }
        100% {
            transform: translateY(-100vh) scale(0);
            opacity: 0;
        }
    }

    .star {
        position: fixed;
        pointer-events: none;
        animation: twinkle ease-in-out infinite;
    }

    @keyframes twinkle {
        0%, 100% { opacity: 0.2; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.2); }
    }

    .content {
        position: relative;
        z-index: 10;
        text-align: center;
        animation: fadeInUp 1.5s ease-out;
    }

    @keyframes fadeInUp {
        0% {
            opacity: 0;
            transform: translateY(50px);
        }
        100% {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .surprise-title {
        font-size: 2.5rem;
        color: white;
        margin-bottom: 30px;
        background: linear-gradient(45deg, #a855f7, #ec4899, #f43f5e, #a855f7);
        background-size: 300% auto;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        animation: shine 3s linear infinite;
        font-weight: 800;
        letter-spacing: 2px;
    }

    @keyframes shine {
        to { background-position: 300% center; }
    }

    .image-wrapper {
        position: relative;
        width: 320px;
        height: 320px;
        margin: 0 auto 30px;
    }

    .surprise-image {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 20px;
        box-shadow: 
            0 0 30px rgba(168, 85, 247, 0.6),
            0 0 60px rgba(236, 72, 153, 0.4),
            0 20px 50px rgba(0,0,0,0.5);
        animation: floatImage 3s ease-in-out infinite, glowPulse 2s ease-in-out infinite;
        border: 3px solid rgba(255,255,255,0.3);
    }

    @keyframes floatImage {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-15px) rotate(1deg); }
    }

    @keyframes glowPulse {
        0%, 100% {
            box-shadow: 
                0 0 30px rgba(168, 85, 247, 0.6),
                0 0 60px rgba(236, 72, 153, 0.4),
                0 20px 50px rgba(0,0,0,0.5);
        }
        50% {
            box-shadow: 
                0 0 50px rgba(168, 85, 247, 0.9),
                0 0 90px rgba(236, 72, 153, 0.6),
                0 20px 50px rgba(0,0,0,0.5);
        }
    }

    /* Sparkles around image */
    .image-wrapper::before,
    .image-wrapper::after {
        content: '✨';
        position: absolute;
        font-size: 2.5rem;
        animation: sparkleFloat 2s ease-in-out infinite;
    }

    .image-wrapper::before {
        top: -20px;
        left: -20px;
        animation-delay: 0s;
    }

    .image-wrapper::after {
        bottom: -20px;
        right: -20px;
        animation-delay: 1s;
    }

    @keyframes sparkleFloat {
        0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.7; }
        50% { transform: scale(1.3) rotate(15deg); opacity: 1; }
    }

    .surprise-message {
        color: rgba(255,255,255,0.9);
        font-size: 1.2rem;
        margin-bottom: 25px;
        text-shadow: 0 2px 10px rgba(168, 85, 247, 0.5);
    }

    .back-btn, .music-toggle-btn {
        background: linear-gradient(45deg, #a855f7, #ec4899);
        color: white;
        border: none;
        padding: 14px 30px;
        font-size: 1rem;
        border-radius: 50px;
        cursor: pointer;
        font-weight: bold;
        box-shadow: 0 8px 20px rgba(168, 85, 247, 0.5);
        transition: transform 0.3s ease;
        margin: 5px;
    }

    .back-btn:hover, .music-toggle-btn:hover {
        transform: translateY(-5px) scale(1.05);
    }

    .music-toggle-btn.playing {
        animation: btnPulse 1s ease-in-out infinite;
    }

    @keyframes btnPulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.08); }
    }

    @media (max-width: 600px) {
        .image-wrapper { width: 250px; height: 250px; }
        .surprise-title { font-size: 1.8rem; }
        .surprise-message { font-size: 1rem; }
    }
</style>
</head>
<body>

<!-- Background Song (different from main page) -->
<audio id="surpriseMusic" loop>
    <source src="surprise-song.mp3" type="audio/mpeg">
</audio>

<div class="content">
    <h1 class="surprise-title">✨ Just For You ✨</h1>

    <div class="image-wrapper">
        <!-- Replace with your surprise image filename -->
        <img src="surprise-photo.jpg" alt="Surprise" class="surprise-image" onerror="this.src='https://via.placeholder.com/320/a855f7/ffffff?text=Surprise+Photo'">
    </div>

    <p class="surprise-message">A little something special, just for you 💜</p>

    <div>
        <button class="music-toggle-btn" id="musicBtn" onclick="toggleMusic()">🔇 Play Song</button>
        <button class="back-btn" onclick="window.location.href='index.html'">⬅ Back to Wishes</button>
    </div>
</div>

<script>
    // ===== SPARKLE PARTICLES =====
    function createSparkles() {
        for (let i = 0; i < 40; i++) {
            const sparkle = document.createElement('div');
            sparkle.classList.add('sparkle');
            sparkle.style.left = Math.random() * 100 + 'vw';
            sparkle.style.bottom = '-10px';
            sparkle.style.animationDuration = (3 + Math.random() * 4) + 's';
            sparkle.style.animationDelay = (Math.random() * 5) + 's';
            document.body.appendChild(sparkle);
        }
    }

    // ===== TWINKLING BACKGROUND STARS =====
    function createStars() {
        for (let i = 0; i < 60; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            star.innerHTML = '⭐';
            star.style.left = Math.random() * 100 + 'vw';
            star.style.top = Math.random() * 100 + 'vh';
            star.style.fontSize = (Math.random() * 8 + 4) + 'px';
            star.style.animationDuration = (2 + Math.random() * 3) + 's';
            star.style.animationDelay = (Math.random() * 3) + 's';
            document.body.appendChild(star);
        }
    }

    // ===== MUSIC PLAYER =====
    const surpriseMusic = document.getElementById('surpriseMusic');
    const musicBtn = document.getElementById('musicBtn');
    let isPlaying = false;

    // 👇 Optional: trim song start/end (in seconds)
    const startTime = 0;
    const endTime = 9999; // set a real number to enable trimming/looping

    function toggleMusic() {
        if (isPlaying) {
            surpriseMusic.pause();
            musicBtn.innerHTML = '🔇 Play Song';
            musicBtn.classList.remove('playing');
        } else {
            if (surpriseMusic.currentTime < startTime || surpriseMusic.currentTime >= endTime) {
                surpriseMusic.currentTime = startTime;
            }
            surpriseMusic.play();
            musicBtn.innerHTML = '🎵 Pause Song';
            musicBtn.classList.add('playing');
        }
        isPlaying = !isPlaying;
    }

    surpriseMusic.addEventListener('timeupdate', function() {
        if (surpriseMusic.currentTime >= endTime) {
            surpriseMusic.currentTime = startTime;
        }
    });

    // ===== ON LOAD =====
    window.onload = function() {
        createSparkles();
        createStars();

        surpriseMusic.volume = 0.5;
        const playPromise = surpriseMusic.play();
        if (playPromise !== undefined) {
            playPromise.then(() => {
                isPlaying = true;
                musicBtn.innerHTML = '🎵 Pause Song';
                musicBtn.classList.add('playing');
            }).catch(() => {
                console.log('Autoplay blocked - waiting for click');
            });
        }
    };

    // Keep generating sparkles continuously
    setInterval(createSparkles, 3000);
</script>

</body>
</html>
